[build]
  # Do not publish the repository root. Doing so made every file in the repo a
  # public URL, including the old Kit email sequences with their upgrade links,
  # the 2026 PRD with the original price list, progress.md and .env.example.
  # build-site.sh copies the site and nothing else.
  command = "bash scripts/check-copy.sh && bash scripts/check-links.sh && bash scripts/build-site.sh"
  publish = "_site"

# Pretty URLs: /about serves about.html
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/products"
  to = "/products.html"
  status = 200

[[redirects]]
  from = "/framework"
  to = "/framework.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

